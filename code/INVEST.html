	<script>


                // GET get parameters
                const query_string = window.location.search;
                params = new URLSearchParams(query_string);

                function get_or(pname, def){
                    param = '';
                    if (params.has(pname)){
                        param = params.get(pname);

                    }
                    if (param === '')
                       return def;
                    else {
                       return param;
                    }
                }

                function arr_get_or(pname, def){
                    txt = '';
                    if (params.has(pname)){
                        txt = params.get(pname)
                    }
                    if (txt === ''){
                        return def;
                    } else {
                        return txt.split(',').map(Number);
                    }
                }

                //---------Create instructions---------
                async function fetchHtmlAsText(url) {
                  const response = await fetch(url);
                  return await response.text();
                }

                async function loadContent(urls) {
                    const docs = urls.map(async (url) => {
                        content = await fetchHtmlAsText(url);
                                console.log("GOT:  " + url);
                        return content;
                    });
                    const a = await Promise.all(docs);
                    return a
                }

                // Call the function to load the content when the script runs
                var instr_urls = [
                    'instructions/instr_00_welcome.txt',
                    'instructions/instr_10_concept.txt',
                    'instructions/instr_20_variance.txt',
                    'instructions/instr_25_start_period.txt',
                    'instructions/instr_30_signals_.txt',
                    'instructions/instr_40_investment.txt',
                    'instructions/instr_50_per_result.txt',
                    'instructions/instr_60_fin_result.txt',
                    'instructions/instr_70_practice.txt',
                    ];


                // Parameters
		var test_mode = get_or('test_mode', false) === 'on';
		var exp_type = parseInt(get_or('exp_type', 'NO_CONFIG_'));
                var show_index = get_or('show_index', false) === 'on';

		var show_instructions = get_or('show_instructions', false) === 'on';
		var show_practice = get_or('show_practice', false) === 'on';
		var show_survey = get_or('show_survey', false) === 'on';

		var show_history = get_or('show_history', false) === 'on';

		var treatments = ["variance", "size", "time"];
		var blocks = jsPsych.randomization.shuffle([0,1]); // block order

                var NAMES = ["Index", "Stock A", "Stock B", "Stock C", "Stock D", "Stock E", "Stock F", "Stock G", "Stock H"]
                var HIST_BOUND = 35;

		// Timing/NPR parameters
                var npr_freq_0 = arr_get_or('npr_freq_0', [500, 500]);
                var npr_freq_1 = arr_get_or('npr_freq_1', [500, 500]);
		var npr_frequency = [npr_freq_0, npr_freq_1];
		var error_std = 10; //standard deviation of npr errors



		// pick a random condition for the subject at the start of the experiment
		// var condition_assignment = jsPsych.randomization.shuffle(['conditionA', 'conditionB', 'conditionC'], 1)[0];

		//---------Set task parameters---------

                var std_I_0 = parseInt(get_or('std_I_0', 5));
                var std_I_1 = parseInt(get_or('std_I_1', 30));
                var prior_std_I = [std_I_0, std_I_1]; // standard deviation of industry factor prior

                var std_S_0 = arr_get_or('std_S_0', [30,30]);
                var std_S_1 = arr_get_or('std_S_1', [30,30]);
                var prior_std_S = [std_S_0, std_S_1]; // standard deviation of stock-specific factor priors

                var mean_S_0 = arr_get_or('mean_S_0', [0,0]);
                var mean_S_1 = arr_get_or('mean_S_1', [0,0]);
                var prior_mean_S = [mean_S_0, mean_S_1]; // Mean of stock-specific factor priors

                var std_N_0 = arr_get_or('std_N_0', [30,30]);
                var std_N_1 = arr_get_or('std_N_1', [30,30]);
                var noise_std = [std_N_0, std_N_1]; // standard deviation of signal noise

                var nf_0 = parseInt(get_or('n_firms_0', 4));
                var nf_1 = parseInt(get_or('n_firms_1', 4));
                var n_firms = [nf_0, nf_1]; // number of firms

                var tl_0 = parseInt(get_or('time_limit_0', 12))
                var tl_1 = parseInt(get_or('time_limit_1', 12))
                var time_limit = [tl_0, tl_1]; //number of seconds allowed

                
                // adjust the means and stds according to whether to show the index or not
                if (show_index) {
                    var start_index = 0;
                    var n_rows = [n_firms[0]+1, n_firms[1]+1];
                    var prior_mean = [Array(n_rows[0]).fill(0), Array(n_rows[1]).fill(0)];
                    var prior_std = [Array(n_rows[0]+1).fill(prior_std_I[0]).fill(prior_std_S[0],1),
                                    Array(n_rows[1]+1).fill(prior_std_I[1]).fill(prior_std_S[1],1)];
                } else {
                    var start_index = 1;
                    var n_rows = n_firms;
                    var prior_mean = [prior_mean_S[0], prior_mean_S[1]];
                    var prior_std = [std_S_0, std_S_1]
                                    
                }
                var names = [NAMES.slice(start_index, n_firms[0]+1),
                            NAMES.slice(start_index, n_firms[1]+1)];

		// Practice parameters
		var practice_n_firms = 2;
		var practice_names = ["Stock A", "Stock B"];
		var practice_prior_mean = Array(practice_n_firms).fill(0);
		var practice_prior_std = [[8, 30], [30, 8]];
		var practice_factors = [[10, 15], [-30, -10]];


		// Reward parameters
		var a = 6;
		//var b = 1/300;
		var b = 1/200;

		// History parameters
		var practice_n_periods = 2; // number of practice periods
                var n_periods = parseInt(get_or('n_periods', 20)); //default is based on quick mode else allow for override
		
		// Write practice history
		var practice_histories = [];
		for (var i = 0; i < practice_n_periods; i++) {
			practice_histories.push([]);
			for (var j = 0; j < practice_n_firms; j++) {
				//x = Math.round(normal(practice_prior_mean[j], practice_prior_std[i][j]));
				x = practice_factors[i][j];
				practice_histories[i].push(x);
			}
		}

		// Write history [period][firm]
		var histories = [];
		for (var i = 0; i < n_periods; i++) {
			histories.push([]);
                        var block = 0;
                        if (i >= n_periods/2) {
                            var block = 1;
                        }
                        var idx = blocks[block];
                        for (var j = 0; j < n_rows[blocks[0]]; j++) {
                                mu = prior_mean[idx][j];
                                std = prior_std[idx][j];
                                x = Math.round(normal(mu, std));
                                while (x > mu + HIST_BOUND || x < mu - HIST_BOUND){
                                    x = Math.round(normal(mu, std));
                                }
                                histories[i].push(x); }
		}
		
		// Randomize order of rows
		var random_order_stocks_practice = []; var random_order_stocks_0 = [];	var random_order_stocks_1 = [];
		for (var j = 0; j < practice_n_firms; j++) random_order_stocks_practice.push(j);
		for (var j = 0; j < n_rows[0]; j++) random_order_stocks_0.push(j);
		for (var j = 0; j < n_rows[1]; j++) random_order_stocks_1.push(j);
		//var random_order_stocks = jsPsych.randomization.shuffle(random_order_stocks); //shuffle order completely
		var practice_random_order_stocks = randomize(random_order_stocks_practice);
                var rand_order_0 = randomize(random_order_stocks_0);
                var rand_order_1 = randomize(random_order_stocks_1);
                var random_order_stocks = [ rand_order_0, rand_order_1 ];

		// generate a random subject ID with 8 characters
		var subject_id = "" + exp_type + Math.floor(Math.random()*10000000);

		// record the condition assignment in the jsPsych data
		// this adds a property called 'subject' and a property called 'condition' to every trial
		jsPsych.data.addProperties({
		  subject: subject_id,
		  npr_frequency: npr_frequency,
		  error_std: error_std,
		  payoff_a: a,
		  payoff_b: b,
		  n_periods: n_periods,
		});




        //write instructions in practice trials
        function style_practice_instruction_fn(factors, t) {
        return "This is a self-paced practice trial. The true stock returns are: "
            +  "<br>Stock A: " + factors[t][0] 
            + "<br>Stock B: " + factors[t][1] 
        }

        function style_practice_view_instruction_fn(factors, t) {
                return style_practice_instruction_fn(factors, t) + "<br>Mouse around the chart to get used to the interface. Click 'Next' when you are ready to proceed."
        }

        function style_practice_forecast_instruction_fn(factors, t) {
                return style_practice_instruction_fn(factors, t) 
                + "<br> Enter the amounts you wish to invest in each stock.  Keep in mind that you do not need to make any investments."
                +  "<br> Click the 'Submit' button once you have made all your investments."
        }

        var questions = [
                        'The information you gather about each stock represents:',
                        'In each period,  the stocks presented will:',
                        'If you choose to not invest some or all of you 100 cash allotment, the cash will earn interest.',
                        ];
        var options = [
                        ['the average return of the stock.', 'complete randomness.', 'the actual return of the stock.', 'none of the above.'],
                        ['both gain in value.', 'both lose value.', 'Can either gain or lose value.'],
                        ['True', 'False']
                      ];
        var comprehension_block = {
                        type: "survey-multi-choice",
                        required: [ true, true, true ],
                        preamble: "Please answer the following questions:",
                        questions: questions,
                        options: options,
                        data: { stage: "comprehension" },
        };

    	var style_instructions_postpractice = [ "<p style='text-align:center'>The real task will now begin! Remember you have a time limit! Click 'Next' when you are ready!</p>" ]

		var instructions_block_postpractice = {
			type: "instructions",
			pages: style_instructions_postpractice,
			show_clickable_nav: true,
			allow_keys: false,
			data: { stage: "instructions" },
		}

		var style_instructions_between_blocks = [ "<p style='text-align:center'>The second set of periods will now begin! Some things may have changed. Click 'Next' when you are ready!</p>" ]

		var instructions_between_blocks = {
			type: "instructions",
			pages: style_instructions_between_blocks,
			show_clickable_nav: true,
			allow_keys: false,
			data: { stage: "instructions" },
		}

		//---------Misc functions---------
		
		// Function to generate random normal numbers
		function normal(mean, std) {
			mean = mean || 0;
			std = std || 1;

			var u = 0, v = 0;
			while(u === 0) u = Math.random(); //Converting [0,1) to (0,1)
			while(v === 0) v = Math.random();
			return mean + std * Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
		}

		// Functions to randomize order
		function randomize (arr) {
			var out = [];
			var pos = jsPsych.randomization.shuffle(arr)[0];
			for (i = 0; i < arr.length; i++) {	if (i < pos) { out.push(arr[i+1]) } else if (i == pos) { out.push(arr[0]) } else { out.push(arr[i]) } }
			return out
		}

		//---------Misc blocks---------
		
		// Consent block
		var check_consent = function(elem) {
			if ($('#consent_checkbox').is(':checked')) {
				return true;
			}
			else {
				alert("If you wish to participate, you must check the box.");
				return false;
			}
			return false;
		};
		
		var consent_block = {
				type:'html',
				url: "consent-forecast.html",
				cont_btn: "start",
				check_fn: check_consent
		};
		
		// Strategy block
		var strategy_block = {
				type: "survey-text-relabel",
				questions: [ "Did you follow a strategy in this task? Did you differentiate between the types of blocks?" ],
				data: { stage: "strategy" },
		};

		// Comments block
		var comment_block = {
				type: "survey-text-relabel",
				questions: [ "Do you have any comments for us about this task?" ],
				data: { stage: "comment" },
		};
		
		// Age block
		var age_block = {
				type: "survey-text-number",
				questions: [ "What is your age (in years)?" ],
				data: { stage: "age" },
		};

		// Worker ID block
		var worker_id_input = {
				type: "survey-text-relabel",
				questions: ["Please input your Mturk Worker ID so that we can pay you the appropriate bonus. Your ID will not be shared with anyone outside of our research team."],
				data: { stage: "idpay" },
		}

		// Bonus block
		//define function for calculating total bonus
		function roundFloat(y,x) { return (Math.floor(y/x) * x).toFixed(2) };
 		function getBonus() {
                    var test_outcomes = jsPsych.data.getTrialsOfType('invest');
                    var total_reward= 0;

                    random_period = Math.floor(Math.random() * (n_periods));
                    total_reward = test_outcomes[random_period].total_result / 200;
                    return total_reward;
		}
		
		var bonus_block = {
                    type: "text",
                    text: function() {
                        var total_bonus = getBonus();
                    jsPsych.data.addDataToLastTrial({"total_bonus": total_bonus});
                                    return "<p class='center-content'> You won a bonus of <strong>$" + total_bonus + ".</strong></p>"+
                            "<p class='center-content'> Press any key to finish the experiment and receive your completion code. Thank you for participating!</p>";
                    },
		};

		// Debriefing block
		var debrief_block = {
				type: 'html',
				url: 'debrief.html',
				cont_btn: "Continue"
		};

		// function to save data (includes MTurk completion code link)
		function saveData(filename, filedata){
			$.ajax({
				type:'post',
				cache: false,
				url: '/code/save_data.php', // this is the path to the above PHP script
				data: {filename: filename, filedata: filedata},
				complete: function() {
					window.location.href = "confirmation_code_H2C.html";
				}
			});
		}

		//-------Main task blocks
async function get_timeline() {
		var timeline = [];

		if (show_instructions) {
			timeline.push(consent_block);

                        var all_instr = await loadContent(instr_urls);
                        var instructions_block = {
                                type: "instructions",
                                pages: all_instr,
                                show_clickable_nav: true,
                                allow_keys: false,
                                data: { stage: "instructions" },
                        }
                        timeline.push(instructions_block);
		}
		
		// Loop through practice periods
                if (show_practice) {
                    for (var t = 0; t < practice_n_periods; t++) {

                                    var practice_view_trial = {
                                            type: "view",
                                            period: t,
                                            n_periods: practice_n_periods,
                                            n_firms: practice_n_firms,
                                            names: practice_names,
                                            // total_time: time_limit,
                                            prior_mean: practice_prior_mean,
                                            prior_std: practice_prior_std[t],
                                            noise_std: noise_std[t],
                                            next_period_realizations: practice_histories[t],
                                            next_button: true,
                                            error_std: error_std,
                                            error_mean: 0,
                                            table_header: true,
                                            frequency: npr_frequency[0],
                                            random_order_stocks: practice_random_order_stocks,
                                            yMax: 100,
                                            yMin: -100,
                                            instructions: style_practice_view_instruction_fn(practice_factors, t),
                                            data: { stage: "view_practice" },
                                    };

                                    var practice_invest_trial = {
                                            type: "invest",
                                            period: t,
                                            n_periods: practice_n_periods,
                                            n_firms: practice_n_firms,
                                            names: practice_names,
                                            endowment: 100,
                                            // total_time: 60*1000,
                                            prior_mean: practice_prior_mean,
                                            prior_std: practice_prior_std[t],
                                            noise_std: noise_std[t],
                                            next_period_realizations: practice_histories[t],
                                            slider_min: -120,
                                            slider_max: 120,
                                            table_header: true,
                                            feedback: true,
                                            random_order_stocks: practice_random_order_stocks,
                                            // forecast_industry: true,
                                            instructions: style_practice_forecast_instruction_fn(practice_factors, t),
                                            yMax: 100,
                                            yMin: -100,
                                            data: { stage: "forecast_practice" },
                                            show_index: show_index,
                                            show_history: show_history,
                                    };

                        timeline.push(practice_view_trial)
                        timeline.push(practice_invest_trial);
                    }
            }

            if (show_instructions) {
                    timeline.push(comprehension_block)
                    timeline.push(instructions_block_postpractice);
            }

            // Loop through real periods
            for (var t = 0; t < n_periods; t++) {

                            if (t < n_periods/2) { bl = blocks[0] } else if (t >= n_periods/2) { bl = blocks[1] };

                            if (t == n_periods/2)  { timeline.push(instructions_between_blocks) };

                            var view_trial = {
                                    type: "view",
                                    period: t,
                                    n_periods: n_periods,
                                    n_firms: n_firms[bl],
                                    names: names[bl],
                                    total_time: time_limit[bl],
                                    prior_mean: prior_mean[bl],
                                    prior_std: prior_std[bl],
                                    noise_std: noise_std[bl],
                                    next_period_realizations: histories[t],
                                    next_button: test_mode,
                                    error_std: error_std,
                                    error_mean: 0,
                                    table_header: true,
                                    frequency: npr_frequency[bl],
                                    random_order_stocks: random_order_stocks[bl],
                                    yMax: 100,
                                    yMin: -100,
                                    instructions: "",
                                    data: { stage: "view_real" },
                            };

                            var invest_trial = {
                                    type: "invest",
                                    period: t,
                                    n_periods: n_periods,
                                    n_firms: n_firms[bl],
                                    names: names[bl],
                                    endowment: 100,
                                    // total_time: 60*1000,
                                    prior_mean: prior_mean[bl],
                                    prior_std: prior_std[bl],
                                    noise_std: noise_std[bl],
                                    next_period_realizations: histories[t],
                                    slider_min: -120,
                                    slider_max: 120,
                                    table_header: true,
                                    feedback: true,
                                    random_order_stocks: random_order_stocks[bl],
                                    // forecast_industry: true,
                                    instructions: "",
                                    yMax: 100,
                                    yMin: -100,
                                    data: { stage: "forecast_real" },
                                    show_index: show_index,
                                    test_mode: test_mode,
                                    show_history: show_history,
                            };

                            timeline.push(view_trial);
                            timeline.push(invest_trial);

            }

	if (show_survey) {
                    timeline.push(strategy_block);
                    timeline.push(comment_block);
                    timeline.push(age_block);
                    timeline.push(worker_id_input);
	}
		timeline.push(bonus_block);
		timeline.push(debrief_block);

        return timeline;
}

		//---------Run the experiment---------
		
    //Initiate the experiment
    get_timeline()
        .then(timeline => {
            jsPsych.init({
                    timeline: timeline,
                    on_finish: function(){ //Execute this when the experiment finishes
                            if (test_mode == true) { jsPsych.data.displayData() } else { saveData(subject_id + '.csv', jsPsych.data.dataAsCSV()) }
                    }
    })});

</script>
</html>

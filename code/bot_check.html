
<div id="anagram-container" style="font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #f9f9f9; text-align: left;">
      <h3 style="margin-top: 0; color: #333;">Cognitive Verification</h3>
      <p style="font-size: 14px; color: #666;">To ensure data integrity, please unscramble the letters below to form a common English word.</p>

      <div id="scrambled-word" style="font-size: 26px; font-weight: bold; letter-spacing: 6px; color: #2c3e50; margin: 20px 0; text-align: center; user-select: none;">
        
      </div>

      <input type="text" id="anagram-answer" autocomplete="off" placeholder="Type unscrambled word..." style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px;">

      <div id="hp_div" style="display:none !important;">
          <label for="hp_question">What's 1+2?</label>
          <input type="text" id="hp_question"  tabindex="-1" autocomplete="off">
      </div>

      <button id="submit-anagram-btn" style="width: 100%; font-size: 16px; font-weight: bold;">Submit Answer</button>
</div>

<html>
<head>
    <title>Test Bed for Investment Experiment</title>

<style>
body{
    padding-left: 30px;
    padding-top: 30px;
}

.collapse{
    border-collapse:collapse;
}

.bordered {
    border: 2px solid gray;
    margin-bottom: 20px;
    padding: 20px;
}

.quick_config li {
    list-style-type: none;
    margin-bottom: 9px;
}

h3 {
    margin-bottom: 0px;
}

ul {
  display: flex;
  flex-wrap: wrap;
  gap: 10px; /* shorthand for row-gap and column-gap */
  padding: 0; /* remove default padding/margin */
  margin: 0;
  list-style-type: none;
}


</style>

<script>
    let PERIODS = 20;
    let PERIODS_Q = 2;

    document.addEventListener("DOMContentLoaded", ready);
    const configs = {
        'prior_var': {
            'name': 'Prior Var.',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 10",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 30",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'PR_VAR',
        },
        'sig_var_1': {
            'name': 'Sig Var. 1',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 20",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'SIG_VAR_1',
        },
        'sig_var_2': {
            'name': 'Sig Var. 2',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 15",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'SIG_VAR_2',
        },
        'cap_time': {
            'name': 'Capacity Time',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 30",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 12,
            'b1_time': 5,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'TIME',
        },
        'cap_freq': {
            'name': 'Capacity Freq',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 30",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "250, 750",
            'show_hist': true,
            'exp_type': 'FREQ',
        },
        'prior_mean_1': {
            'name': 'Prior Mean 1',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "30, 20",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 30",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'PR_MN_1',
        },
        'prior_mean_2': {
            'name': 'Prior Mean 2',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "35, 15",
            'b0_ns_std': "30, 30",
            'b1_ns_std': "30, 30",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'PR_MN_2',
        },
        'sig_hi_var': {
            'name': 'Signal Hi Var.',
            'b0_pr_std': "20, 20",
            'b1_pr_std': "20, 20",
            'b0_pr_mn': "25, 22",
            'b1_pr_mn': "25, 22",
            'b0_ns_std': "50, 50",
            'b1_ns_std': "50, 50",
            'b0_n': 2,
            'b1_n': 2,
            'b0_time': 10,
            'b1_time': 10,
            'b0_freq': "500, 500",
            'b1_freq': "500, 500",
            'show_hist': true,
            'exp_type': 'SIG_VAR_HI',
        },
    }

    function ready() {
        // Quick Mode Checkbox
        let qm = document.getElementById('quick_mode');
        qm.addEventListener('change', handleQM);

        //Add Quick-Config Buttons
        qc_list = document.getElementById('quick_config_list');
        Object.entries(configs).forEach(([key, config])  => {
        
            btn = document.createElement("input");
            btn.type="button";
            btn.id = key;
            btn.value = config['name'];
            btn.classList.add("quick_b");

            li = document.createElement("li");
            li.appendChild(btn);

            qc_list.appendChild(li);
        });


        const quick_buttons = document.querySelectorAll('.quick_b');
        quick_buttons.forEach(b => {
            let config = configs[b.id]

            b.addEventListener('click', function(event) {
                set_configs(config);
            });
        });

    };

    function set_configs(config){
        document.getElementById("std_S_0").value = config['b0_pr_std'];
        document.getElementById("std_S_1").value = config['b1_pr_std'];
        document.getElementById("mean_S_0").value = config['b0_pr_mn'];
        document.getElementById("mean_S_1").value = config['b1_pr_mn'];
        document.getElementById("std_N_0").value = config['b0_ns_std'];
        document.getElementById("std_N_1").value = config['b1_ns_std'];
        document.getElementById("n_firms_0").value = config['b0_n'];
        document.getElementById("n_firms_1").value = config['b1_n'];
        document.getElementById("time_limit_0").value = config['b0_time'];
        document.getElementById("time_limit_1").value = config['b1_time'];
        document.getElementById("npr_freq_0").value = config['b0_freq'];
        document.getElementById("npr_freq_1").value = config['b1_freq'];
        if (config['show_hist']) {
            document.getElementById("show_history").checked = true;
        } else {
            document.getElementById("show_history").checked = false;
        }
        document.getElementById("exp_type").value = config['exp_type'];
    }

    function handleQM() {
        let instr = document.getElementById('instr');
        let practice = document.getElementById('practice');
        let survey = document.getElementById('survey');
        let n_periods= document.getElementById('periods');

        if (this.checked) {
            instr.checked = false;
            practice.checked = false;
            survey.checked = false;
            n_periods.value= PERIODS_Q;
        } else {
            instr.checked = true;
            practice.checked = true;
            survey.checked = true;
            n_periods.value= PERIODS;
        }
    }



</script>

</head>
<body>
    <form method="GET" action="code/INVEST.html">
        <table class="collapse">
            <tr>
                <td>Test Mode</td>
                <td><input type="checkbox" name="test_mode"/></td>
            </tr>
            <tr>
                <td>Quick Mode</td>
                <td><input id="quick_mode" type="checkbox" name="quick_mode"/></td>
            </tr>
            <tr>
                <td>Show Instructions (includes consent and post-practice instructions)</td>
                <td><input id='instr' type="checkbox" name="show_instructions" checked/></td>
            </tr>
            <tr>
                <td>Show Practice</td>
                <td><input id='practice' type="checkbox" name="show_practice" checked/></td>
            </tr>
            <tr>
                <td>Show Survey</td>
                <td><input id='survey' type="checkbox" name="show_survey" checked/></td>
            </tr>
            <tr>
                <td>Number Periods (both blocks)</td>
                <td><input id='periods' type="text" name="n_periods" value="20"></td>
            </tr>
        </table>
       
        <h3>Quick Config</h3>
        <div class="bordered">
        <ul id="quick_config_list" class=quick_config>
        </ul>
        </div>

        <h3>Session Configuration</h3>
        <table class="bordered">
            <tr>
                <td>&nbsp;</td>
                <td>Block 0</td>
                <td>Block 1</td>
            </tr>
            <!--
            <tr>
                <td>Index Std.</td>
                <td><input type=text value="5" name="std_I_0"/></td>
                <td><input type=text value="30" name="std_I_1"/></td>
            </tr>
            -->
            <tr>
                <td>Stock Std.</td>
                <td><input type=text value="30,30" name="std_S_0" id="std_S_0"/></td>
                <td><input type=text value="30,30" name="std_S_1" id="std_S_1"/></td>
            </tr>
            <tr>
                <td>Stock Means</td>
                <td><input type=text value="0,0" name="mean_S_0" id="mean_S_0"/></td>
                <td><input type=text value="0,0" name="mean_S_1" id="mean_S_1"/></td>
            </tr>
            <tr>
                <td>Noise Std.</td>
                <td><input type=text value="5,30" name="std_N_0" id="std_N_0"/></td>
                <td><input type=text value="30,30" name="std_N_1" id="std_N_1"/></td>
            </tr>
            <tr>
                <td>N Firms</td>
                <td><input type=text value="2" name="n_firms_0" id="n_firms_0"/></td>
                <td><input type=text value="2" name="n_firms_1" id="n_firms_1"/></td>
            </tr>
            <tr>
                <td>Time Limit</td>
                <td><input type=text value="12" name="time_limit_0" id="time_limit_0"/></td>
                <td><input type=text value="12" name="time_limit_1" id="time_limit_1"/></td>
            </tr>
            <tr>
                <td>NPR Freq</td>
                <td><input type=text value="250,1000" name="npr_freq_0" id="npr_freq_0"/></td>
                <td><input type=text value="500,500" name="npr_freq_1" id="npr_freq_1"/></td>
            </tr>
            <tr>
                <td>Show History</td>
                <td colspan="2"><input type="checkbox" name="show_history" id="show_history" checked/></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input id="exp_type" type="text" name="exp_type" value="FREE"/>
                </td>
            </tr>
        </table>


        <input type="submit"/>
    </form>
</body>
</html>
